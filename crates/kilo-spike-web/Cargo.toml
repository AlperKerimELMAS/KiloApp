description = "Spike: measure the cost of YouTube's own player in a hidden system web view"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kilo-probe = { path = "../kilo-probe" }

[target.'cfg(target_os = "macos")'.dependencies]
