[package]
name = "kilo-spike-web"
description = "Spike: measure the cost of YouTube's own player in a hidden system web view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kilo-probe = { path = "../kilo-probe" }

block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "bitflags",
    "block2",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSEnumerator",
    "NSError",
    "NSHTTPCookie",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSURLRequest",
    "bitflags",
    "block2",
    "objc2-core-foundation",
] }
objc2-web-kit = { workspace = true, features = [
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKPreferences",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebpagePreferences",
    "WKWebsiteDataStore",
    "bitflags",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
] }
