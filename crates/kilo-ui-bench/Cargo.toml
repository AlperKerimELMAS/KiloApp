[package]
name = "kilo-ui-bench"
description = "Bench: memory of a YouTube Music-like window in native AppKit (used to find costly system controls)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kilo-probe = { path = "../kilo-probe" }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGlassEffectView",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSScrollView",
    "NSSearchField",
    "NSSlider",
    "NSStackView",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "bitflags",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSString",
    "NSTimer",
    "bitflags",
    "block2",
    "objc2-core-foundation",
] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "objc2-core-foundation",
] }
