[package]
name = "kilo-core"
description = "Kilo's core: YouTube Music API client, parsers, models and queue (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# macOS's own TLS (Security.framework): no TLS code of our own.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
