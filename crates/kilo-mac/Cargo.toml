[package]
name = "kilo-mac"
description = "Kilo for macOS: native AppKit front end"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "Kilo"
path = "src/main.rs"

[dependencies]
kilo-core = { path = "../kilo-core" }
kilo-player = { path = "../kilo-player" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"
