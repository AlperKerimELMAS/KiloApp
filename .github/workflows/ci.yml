name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (and Windows clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo clippy --release --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --workspace

  linux:
    name: Linux (portable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --release -p kilo-core -p kilo-player -p kilo-probe --all-targets -- -D warnings
      - run: cargo test -p kilo-core -p kilo-player -p kilo-probe
