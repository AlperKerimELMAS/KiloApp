name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (and Windows clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo clippy --release --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --workspace

  linux:
    name: Linux (portable crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -p kilo-core -p kilo-player -p kilo-probe --all-targets -- -D warnings
      - run: cargo test -p kilo-core -p kilo-player -p kilo-probe
