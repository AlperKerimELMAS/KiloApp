[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

# One version of each macOS binding for every crate.
[workspace.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
# Apple's framework bindings compile every header by default (AppKit alone
# was 127 MB per build, and pulled in CloudKit, Core Data, Metal…): each
# crate turns on only the headers it uses.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std"] }

[workspace.lints.clippy]
# Every `unsafe` block says why it's sound (`// SAFETY: …`).
undocumented_unsafe_blocks = "warn"

# Every kilobyte counts: release builds trade compile time for size and speed.
# opt-level "z", measured against 3 (2026-10-08): binary 1,624 -> 1,165 KB,
# same startup (~0.16 s to Home) and memory (31 MB idle, 143 MB playing),
# parsing a 412 KB page 0.6 -> 0.6-1.0 ms. The heavy work (WebKit, ImageIO,
# TLS) is the system's, so Kilo's own code barely shows in CPU.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
