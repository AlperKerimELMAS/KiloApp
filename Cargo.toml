[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

# Every kilobyte counts: release builds trade compile time for size and speed.
# opt-level 3 vs "s" is decided by measurement, not by taste (see docs/PLAN.md).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
