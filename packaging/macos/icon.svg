<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Graphite, a little lighter at the top -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e21"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <!-- A faint rim of light along the top edge -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824x824 squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- a lowercase k, in warm white -->
  <g fill="none" stroke="#f2f0ea" stroke-linecap="round" stroke-linejoin="round" stroke-width="86">
    <path d="M392 290 V734"/>
    <path d="M640 438 L418 610"/>
    <path d="M510 540 L648 734"/>
  </g>
</svg>
