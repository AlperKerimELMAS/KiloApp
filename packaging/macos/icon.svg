<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.55" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824x824 squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="84">
    <!-- a light lowercase k -->
    <path d="M372 286 V738"/>
    <path d="M640 446 L392 600"/>
    <path d="M500 535 L652 738"/>
  </g>
  <!-- three sound bars, tapering: "every kilobyte counts" -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="700" y="318" width="40" height="120" rx="20"/>
    <rect x="764" y="350" width="40" height="72" rx="20"/>
  </g>
</svg>
